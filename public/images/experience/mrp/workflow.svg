<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#10152c"/><text x="70" y="95" fill="#ffffff" font-family="Arial" font-size="30" font-weight="700">Procurement Workflow</text><text x="70" y="140" fill="#b8b1ff" font-family="Arial" font-size="18">From request to delivery</text><g fill="#1e2854" stroke="#5b4ed8" stroke-width="2"><rect x="70" y="250" width="190" height="100" rx="14"/><rect x="330" y="250" width="190" height="100" rx="14"/><rect x="590" y="250" width="190" height="100" rx="14"/><rect x="850" y="250" width="190" height="100" rx="14"/></g><g fill="#ffffff" font-family="Arial" font-size="18" text-anchor="middle"><text x="165" y="308">Purchase Request</text><text x="425" y="308">Approval</text><text x="685" y="308">Purchase Order</text><text x="945" y="308">Delivery</text></g><g stroke="#b8b1ff" stroke-width="6"><line x1="260" y1="300" x2="330" y2="300"/><line x1="520" y1="300" x2="590" y2="300"/><line x1="780" y1="300" x2="850" y2="300"/></g><text x="70" y="500" fill="#c2c6d8" font-family="Arial" font-size="19">7 role-based checkpoints connected in one workflow</text></svg>